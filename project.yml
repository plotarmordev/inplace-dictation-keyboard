# Source of InPlace.xcodeproj. After editing, regenerate with `xcodegen`.
name: InPlace
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
fileGroups:
  - Config.xcconfig
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: 1
    INFOPLIST_KEY_CFBundleDisplayName: InPlace
    INFOPLIST_KEY_NSMicrophoneUsageDescription: InPlace listens to your voice while you dictate.
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: InPlace turns what you say into text.
packages:
  DictationCore:
    path: DictationCore
targets:
  InPlace:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: InPlaceKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).inplace
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
  InPlaceKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    dependencies:
      - package: DictationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).inplace.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
schemes:
  InPlace:
    build:
      targets:
        InPlace: all
    run:
      config: Debug
    test:
      targets:
        - package: DictationCore/DictationCoreTests
